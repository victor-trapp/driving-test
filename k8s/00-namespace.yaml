apiVersion: v1
kind: Namespace
metadata:
  name: driving-theory
  annotations:
    # Flux must never delete this, even if it's removed from git: deleting the namespace
    # deletes the PVC and the database with it.
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    app.kubernetes.io/part-of: driving-theory
    # Pods here run as non-root with a read-only root filesystem, so the restricted profile fits.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
